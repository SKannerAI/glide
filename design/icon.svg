<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1c1e"/><stop offset="1" stop-color="#050505"/></linearGradient>
    <linearGradient id="or" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF9A3D"/><stop offset="1" stop-color="#FF5A00"/></linearGradient>
    <filter id="gl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- macOS icon grid: artwork inset with ~100px margin for shadow/breathing room -->
  <g transform="translate(100,100) scale(0.8047)">
    <rect x="32" y="32" width="960" height="960" rx="232" fill="url(#bg)" stroke="#FF5A00" stroke-opacity="0.16" stroke-width="4"/>
    <!-- faded script lines above/below the active line (fade toward edges) -->
    <g fill="url(#or)">
      <rect x="360" y="204" width="350" height="52" rx="26" opacity="0.13"/>
      <rect x="360" y="292" width="300" height="52" rx="26" opacity="0.22"/>
      <rect x="360" y="380" width="380" height="52" rx="26" opacity="0.34"/>
      <rect x="360" y="592" width="320" height="52" rx="26" opacity="0.40"/>
      <rect x="360" y="680" width="400" height="52" rx="26" opacity="0.26"/>
      <rect x="360" y="768" width="270" height="52" rx="26" opacity="0.15"/>
    </g>
    <!-- center icon: bright active bar + playhead marker, scaled 28% about its center (502,512) -->
    <g transform="translate(502,512) scale(1.28) translate(-502,-512)" fill="url(#or)" filter="url(#gl)">
      <rect x="330" y="470" width="424" height="84" rx="42"/>
      <path d="M250 466 L316 512 L250 558 Z"/>
    </g>
  </g>
</svg>
